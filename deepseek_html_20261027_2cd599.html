<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LUXE JEWELS · Fine Jewelry Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ========== RESET & BASE ========== */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}
:root {
  --gold: #c9a961;
  --gold-dark: #a8884a;
  --gold-light: #e0c88a;
  --black: #0f0f0f;
  --charcoal: #1a1a1a;
  --cream: #fbf8f3;
  --cream-dark: #f2ece1;
  --text: #2a2520;
  --muted: #8a7e72;
  --border: #e8e0d4;
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--cream);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
}
h1, h2, h3, h4 { font-family: 'Cormorant Garamond', serif; font-weight: 500; letter-spacing: 0.02em; }
img { display: block; max-width: 100%; }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ========== TOP BAR ========== */
.top-bar {
  background: var(--black);
  color: var(--cream);
  font-size: 0.72rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  padding: 10px 0;
  text-align: center;
  overflow: hidden;
  position: relative;
}
.top-bar::before {
  content: '✦ FREE SHIPPING ON ORDERS OVER $200 · COMPLIMENTARY GIFT WRAPPING · LIFETIME WARRANTY ✦';
  display: inline-block;
  white-space: nowrap;
  animation: scrollText 30s linear infinite;
}
@keyframes scrollText {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ========== HEADER ========== */
.header {
  position: sticky;
  top: 0;
  background: rgba(251, 248, 243, 0.95);
  backdrop-filter: blur(12px);
  z-index: 900;
  border-bottom: 1px solid var(--border);
}
.header-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 0;
}
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 40px;
}
.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2rem;
  letter-spacing: 8px;
  font-weight: 400;
  color: var(--black);
}
.logo span { color: var(--gold); font-weight: 600; }
.nav-links {
  display: flex;
  gap: 42px;
  list-style: none;
}
.nav-links a {
  font-size: 0.78rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  font-weight: 400;
  color: var(--charcoal);
  position: relative;
  padding: 6px 0;
  transition: color 0.3s;
}
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0;
  width: 0; height: 1px;
  background: var(--gold);
  transition: width 0.3s;
}
.nav-links a:hover { color: var(--gold-dark); }
.nav-links a:hover::after { width: 100%; }

.header-icons {
  display: flex;
  gap: 26px;
  font-size: 1.05rem;
  color: var(--charcoal);
  align-items: center;
}
.header-icons i {
  cursor: pointer;
  transition: color 0.25s, transform 0.25s;
}
.header-icons i:hover { color: var(--gold); transform: translateY(-2px); }
.cart-wrap {
  position: relative;
}
.cart-badge {
  position: absolute;
  top: -8px; right: -11px;
  background: var(--gold);
  color: white;
  font-size: 0.65rem;
  font-weight: 600;
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  font-family: 'Inter', sans-serif;
}

/* ========== HERO VIDEO ========== */
.hero {
  position: relative;
  height: 92vh;
  min-height: 620px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--black);
}
.hero-video {
  position: absolute;
  top: 50%; left: 50%;
  min-width: 100%; min-height: 100%;
  width: auto; height: auto;
  transform: translate(-50%, -50%);
  object-fit: cover;
  opacity: 0.65;
  z-index: 0;
}
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(15,15,15,0.55) 0%, rgba(15,15,15,0.25) 50%, rgba(15,15,15,0.7) 100%);
  z-index: 1;
}
.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  color: var(--cream);
  padding: 0 20px;
  max-width: 900px;
}
.hero-subtitle {
  font-size: 0.85rem;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--gold-light);
  margin-bottom: 28px;
  font-weight: 300;
}
.hero-title {
  font-size: clamp(2.8rem, 7vw, 5.5rem);
  line-height: 1.05;
  font-weight: 300;
  margin-bottom: 30px;
  letter-spacing: 0.5px;
}
.hero-title em {
  font-style: italic;
  color: var(--gold-light);
  font-weight: 400;
}
.hero-desc {
  font-size: 1.05rem;
  color: rgba(251, 248, 243, 0.85);
  max-width: 560px;
  margin: 0 auto 45px;
  font-weight: 300;
  letter-spacing: 0.5px;
}
.btn-hero {
  display: inline-block;
  padding: 16px 54px;
  background: transparent;
  color: var(--cream);
  border: 1px solid var(--gold-light);
  font-size: 0.78rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
}
.btn-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--gold);
  transform: translateY(100%);
  transition: transform 0.4s ease;
  z-index: -1;
}
.btn-hero:hover { color: var(--black); border-color: var(--gold); }
.btn-hero:hover::before { transform: translateY(0); }

/* scroll indicator */
.scroll-hint {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  color: var(--gold-light);
  font-size: 0.7rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  animation: bounce 2.5s infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-8px); }
}

/* ========== MARQUEE STRIP ========== */
.marquee-strip {
  background: var(--gold);
  color: var(--black);
  padding: 18px 0;
  overflow: hidden;
  border-top: 1px solid var(--gold-dark);
  border-bottom: 1px solid var(--gold-dark);
}
.marquee-track {
  display: flex;
  gap: 60px;
  white-space: nowrap;
  animation: marquee 35s linear infinite;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-style: italic;
  letter-spacing: 2px;
}
.marquee-track span { display: inline-flex; align-items: center; gap: 60px; }
@keyframes marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ========== SECTION HEADERS ========== */
.section {
  padding: 110px 0;
}
.section-head {
  text-align: center;
  margin-bottom: 70px;
}
.section-eyebrow {
  font-size: 0.72rem;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--gold-dark);
  margin-bottom: 18px;
  font-weight: 500;
}
.section-title {
  font-size: clamp(2rem, 4vw, 3.2rem);
  color: var(--black);
  font-weight: 400;
  letter-spacing: 1px;
}
.section-title em { font-style: italic; color: var(--gold-dark); }
.section-desc {
  color: var(--muted);
  max-width: 520px;
  margin: 20px auto 0;
  font-size: 0.98rem;
  font-weight: 300;
}

/* ========== COLLECTIONS (3 image cards) ========== */
.collections {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
}
.collection-card {
  position: relative;
  overflow: hidden;
  aspect-ratio: 3/4;
  cursor: pointer;
  background: var(--charcoal);
}
.collection-card img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
  opacity: 0.85;
}
.collection-card:hover img {
  transform: scale(1.08);
  opacity: 1;
}
.collection-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.15) 50%, transparent 100%);
  transition: opacity 0.5s;
}
.collection-label {
  position: absolute;
  bottom: 36px; left: 36px;
  z-index: 2;
  color: var(--cream);
}
.collection-label span {
  font-size: 0.7rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--gold-light);
  display: block;
  margin-bottom: 8px;
}
.collection-label h3 {
  font-size: 2rem;
  font-weight: 400;
  letter-spacing: 1px;
}

/* ========== PRODUCT GRID ========== */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 40px 30px;
}
.product-card {
  position: relative;
  background: transparent;
  transition: transform 0.4s ease;
}
.product-card:hover { transform: translateY(-6px); }
.product-img-wrap {
  position: relative;
  overflow: hidden;
  aspect-ratio: 1/1;
  background: var(--cream-dark);
  margin-bottom: 22px;
}
.product-img-wrap img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.8s ease;
}
.product-card:hover .product-img-wrap img {
  transform: scale(1.06);
}
.product-badge {
  position: absolute;
  top: 16px; left: 16px;
  background: var(--black);
  color: var(--cream);
  font-size: 0.62rem;
  letter-spacing: 2px;
  padding: 6px 12px;
  text-transform: uppercase;
  z-index: 2;
}
.quick-add {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: var(--black);
  color: var(--cream);
  padding: 15px;
  text-align: center;
  font-size: 0.72rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(100%);
  transition: all 0.35s ease;
  z-index: 3;
}
.product-card:hover .quick-add {
  opacity: 1;
  transform: translateY(0);
}
.quick-add:hover { background: var(--gold); color: var(--black); }
.product-info { text-align: center; }
.product-category {
  font-size: 0.68rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--gold-dark);
  margin-bottom: 8px;
}
.product-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.35rem;
  color: var(--black);
  margin-bottom: 8px;
  font-weight: 500;
}
.product-price {
  font-size: 0.95rem;
  color: var(--text);
  font-weight: 400;
}

/* ========== VIDEO SHOWCASE ========== */
.video-showcase {
  background: var(--black);
  color: var(--cream);
  padding: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 600px;
}
.video-box {
  position: relative;
  overflow: hidden;
}
.video-box video {
  width: 100%; height: 100%;
  object-fit: cover;
  min-height: 600px;
}
.video-content {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 80px 70px;
}
.video-content .section-eyebrow {
  color: var(--gold-light);
  text-align: left;
}
.video-content h2 {
  font-size: clamp(2rem, 3.5vw, 3rem);
  line-height: 1.15;
  font-weight: 300;
  margin-bottom: 26px;
  color: var(--cream);
}
.video-content h2 em { color: var(--gold-light); font-style: italic; }
.video-content p {
  color: rgba(251, 248, 243, 0.7);
  margin-bottom: 40px;
  font-weight: 300;
  max-width: 440px;
  line-height: 1.8;
}

/* ========== STORY / CRAFT SECTION ========== */
.story {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
}
.story-img {
  position: relative;
  aspect-ratio: 4/5;
  overflow: hidden;
}
.story-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 1.2s ease;
}
.story-img:hover img { transform: scale(1.05); }
.story-img::before {
  content: '';
  position: absolute;
  inset: 22px;
  border: 1px solid rgba(201, 169, 97, 0.6);
  z-index: 2;
  pointer-events: none;
}
.story-text .section-eyebrow { text-align: left; }
.story-text h2 {
  font-size: clamp(2rem, 3.5vw, 3rem);
  color: var(--black);
  margin-bottom: 26px;
  line-height: 1.15;
}
.story-text h2 em { color: var(--gold-dark); }
.story-text p {
  color: var(--muted);
  margin-bottom: 22px;
  font-weight: 300;
  line-height: 1.9;
}
.story-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 44px;
  padding-top: 40px;
  border-top: 1px solid var(--border);
}
.stat h4 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.4rem;
  color: var(--gold-dark);
  font-weight: 500;
  margin-bottom: 4px;
}
.stat span {
  font-size: 0.7rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}

/* ========== TESTIMONIALS ========== */
.testimonials {
  background: var(--cream-dark);
}
.testi-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
}
.testi-card {
  background: var(--cream);
  padding: 45px 35px;
  border: 1px solid var(--border);
  position: relative;
  transition: all 0.4s ease;
}
.testi-card:hover {
  border-color: var(--gold);
  transform: translateY(-5px);
  box-shadow: 0 20px 50px -20px rgba(0,0,0,0.12);
}
.testi-stars {
  color: var(--gold);
  margin-bottom: 20px;
  font-size: 0.85rem;
  letter-spacing: 3px;
}
.testi-quote {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2rem;
  font-style: italic;
  color: var(--text);
  line-height: 1.7;
  margin-bottom: 28px;
}
.testi-author {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-top: 22px;
  border-top: 1px solid var(--border);
}
.testi-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--gold);
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2rem;
  font-weight: 600;
}
.testi-name { font-size: 0.88rem; font-weight: 500; }
.testi-loc { font-size: 0.72rem; color: var(--muted); letter-spacing: 1px; }

/* ========== NEWSLETTER ========== */
.newsletter {
  background: var(--black);
  color: var(--cream);
  text-align: center;
  padding: 100px 20px;
}
.newsletter .section-eyebrow { color: var(--gold-light); }
.newsletter h2 {
  font-size: clamp(2rem, 4vw, 3rem);
  color: var(--cream);
  margin-bottom: 20px;
  font-weight: 300;
}
.newsletter p {
  color: rgba(251, 248, 243, 0.6);
  margin-bottom: 40px;
  font-weight: 300;
}
.newsletter-form {
  display: flex;
  max-width: 520px;
  margin: 0 auto;
  border-bottom: 1px solid var(--gold);
}
.newsletter-form input {
  flex: 1;
  background: transparent;
  border: none;
  padding: 16px 4px;
  color: var(--cream);
  font-size: 0.95rem;
  outline: none;
  font-family: inherit;
}
.newsletter-form input::placeholder { color: rgba(251,248,243,0.4); }
.newsletter-form button {
  color: var(--gold-light);
  letter-spacing: 3px;
  text-transform: uppercase;
  font-size: 0.75rem;
  padding: 16px 4px;
  transition: color 0.3s;
}
.newsletter-form button:hover { color: var(--cream); }

/* ========== FOOTER ========== */
.footer {
  background: var(--charcoal);
  color: rgba(251, 248, 243, 0.7);
  padding: 80px 0 0;
}
.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 60px;
  padding-bottom: 60px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.footer-brand .logo {
  color: var(--cream);
  font-size: 1.8rem;
  margin-bottom: 22px;
  display: inline-block;
}
.footer-brand p {
  font-size: 0.88rem;
  line-height: 1.9;
  max-width: 320px;
  margin-bottom: 28px;
  font-weight: 300;
}
.footer-col h4 {
  color: var(--cream);
  font-family: 'Inter', sans-serif;
  font-size: 0.78rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 24px;
  font-weight: 500;
}
.footer-col ul { list-style: none; }
.footer-col ul li { margin-bottom: 12px; }
.footer-col ul li a {
  font-size: 0.88rem;
  color: rgba(251, 248, 243, 0.65);
  transition: color 0.3s;
  font-weight: 300;
}
.footer-col ul li a:hover { color: var(--gold-light); }

.social-links {
  display: flex;
  gap: 14px;
}
.social-links a {
  width: 40px; height: 40px;
  border: 1px solid rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  color: var(--cream);
  font-size: 0.9rem;
  transition: all 0.3s;
}
.social-links a:hover {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--black);
  transform: translateY(-3px);
}

/* WhatsApp contact strip */
.whatsapp-strip {
  background: var(--gold);
  color: var(--black);
  text-align: center;
  padding: 26px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  letter-spacing: 1px;
}
.whatsapp-strip i { font-size: 1.6rem; }
.whatsapp-strip a {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--black);
  color: var(--cream);
  padding: 12px 32px;
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  letter-spacing: 2px;
  font-weight: 500;
  transition: all 0.3s;
}
.whatsapp-strip a:hover {
  background: var(--charcoal);
  transform: scale(1.03);
}

.footer-bottom {
  text-align: center;
  padding: 28px 0;
  font-size: 0.78rem;
  letter-spacing: 1.5px;
  color: rgba(251, 248, 243, 0.4);
}

/* ========== FLOATING WHATSAPP BUTTON ========== */
.float-wa {
  position: fixed;
  bottom: 28px; right: 28px;
  width: 62px; height: 62px;
  background: #25D366;
  color: white;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem;
  box-shadow: 0 10px 30px rgba(37, 211, 102, 0.45);
  z-index: 998;
  transition: all 0.3s ease;
  animation: waPulse 2.5s infinite;
}
.float-wa:hover { transform: scale(1.08) rotate(6deg); }
@keyframes waPulse {
  0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.55); }
  70% { box-shadow: 0 0 0 22px rgba(37, 211, 102, 0); }
  100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
}

/* ========== CART PANEL ========== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 15, 15, 0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
  z-index: 1000;
  backdrop-filter: blur(2px);
}
.overlay.active { opacity: 1; pointer-events: auto; }
.cart-panel {
  position: fixed;
  top: 0; right: -440px;
  width: 420px;
  max-width: 100%;
  height: 100vh;
  background: var(--cream);
  z-index: 1001;
  display: flex;
  flex-direction: column;
  transition: right 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  box-shadow: -20px 0 60px rgba(0,0,0,0.15);
}
.cart-panel.open { right: 0; }
.cart-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 28px 30px;
  border-bottom: 1px solid var(--border);
}
.cart-head h3 {
  font-size: 1.5rem;
  letter-spacing: 2px;
  color: var(--black);
  font-weight: 500;
}
.close-cart {
  font-size: 1.8rem;
  color: var(--charcoal);
  line-height: 1;
  transition: color 0.2s;
}
.close-cart:hover { color: var(--gold-dark); }
.cart-body {
  flex: 1;
  overflow-y: auto;
  padding: 10px 30px;
}
.cart-empty {
  text-align: center;
  padding: 80px 20px;
  color: var(--muted);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.3rem;
  font-style: italic;
}
.cart-empty i {
  display: block;
  font-size: 2.5rem;
  color: var(--border);
  margin-bottom: 20px;
}
.cart-item {
  display: flex;
  gap: 16px;
  padding: 22px 0;
  border-bottom: 1px solid var(--border);
}
.cart-item img {
  width: 80px; height: 80px;
  object-fit: cover;
  background: var(--cream-dark);
}
.cart-item-info { flex: 1; }
.cart-item-info h4 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  color: var(--black);
  margin-bottom: 4px;
  font-weight: 600;
}
.cart-item-info .price { font-size: 0.88rem; color: var(--gold-dark); margin-bottom: 10px; }
.qty-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}
.qty-controls button {
  width: 26px; height: 26px;
  border: 1px solid var(--border);
  color: var(--charcoal);
  font-size: 0.9rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.qty-controls button:hover {
  background: var(--black);
  color: var(--cream);
  border-color: var(--black);
}
.qty-controls span { font-size: 0.9rem; min-width: 20px; text-align: center; }
.remove-btn {
  color: var(--muted);
  font-size: 0.9rem;
  margin-left: auto;
  align-self: flex-start;
  transition: color 0.2s;
}
.remove-btn:hover { color: #c0392b; }
.cart-foot {
  padding: 26px 30px 30px;
  border-top: 1px solid var(--border);
  background: var(--cream-dark);
}
.cart-total-row {
  display: flex;
  justify-content: space-between;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  color: var(--black);
  margin-bottom: 20px;
}
.checkout-btn {
  width: 100%;
  background: var(--black);
  color: var(--cream);
  padding: 17px;
  font-size: 0.78rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  transition: background 0.3s;
}
.checkout-btn:hover { background: var(--gold); color: var(--black); }

/* ========== TOAST ========== */
.toast {
  position: fixed;
  bottom: 110px; left: 50%;
  transform: translateX(-50%) translateY(30px);
  background: var(--black);
  color: var(--cream);
  padding: 15px 32px;
  font-size: 0.8rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  z-index: 1100;
  opacity: 0;
  pointer-events: none;
  transition: all 0.35s ease;
  border-left: 3px solid var(--gold);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ========== RESPONSIVE ========== */
@media (max-width: 1024px) {
  .container { padding: 0 24px; }
  .nav-links { display: none; }
  .video-showcase { grid-template-columns: 1fr; }
  .video-box video { min-height: 400px; }
  .story { grid-template-columns: 1fr; gap: 50px; }
  .collections { grid-template-columns: 1fr 1fr; }
  .testi-grid { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr 1fr; gap: 40px; }
}
@media (max-width: 640px) {
  .section { padding: 70px 0; }
  .collections { grid-template-columns: 1fr; }
  .product-grid { grid-template-columns: 1fr 1fr; gap: 30px 16px; }
  .hero { height: 85vh; min-height: 520px; }
  .hero-title { font-size: 2.5rem; }
  .video-content { padding: 50px 28px; }
  .footer-grid { grid-template-columns: 1fr; }
  .story-stats { grid-template-columns: 1fr; gap: 26px; }
  .cart-panel { width: 100%; right: -100%; }
  .newsletter-form { flex-direction: column; border: none; }
  .newsletter-form input { border-bottom: 1px solid var(--gold); text-align: center; }
  .float-wa { width: 54px; height: 54px; font-size: 1.5rem; bottom: 20px; right: 20px; }
  .whatsapp-strip { font-size: 1.1rem; }
}
</style>
